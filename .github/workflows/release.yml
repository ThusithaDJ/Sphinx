name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: sphinx-v__VERSION__
          releaseName: "Sphinx v__VERSION__"
          releaseBody: |
            See the assets below to download this version.

            **Windows:** use the `-setup.exe` or `.msi` installer, or `_portable.exe` to run without installing (needs the WebView2 runtime, which Windows 11 already includes).

            Sphinx needs `exiftool` on PATH (or configured under Connections → Local tools) to embed metadata, and `ffmpeg` for video keyframe extraction. Neither is bundled.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bare app exe embeds the whole frontend, so it runs without the
      # installer. Uploaded by release id because the draft has no tag yet.
      - name: upload portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NAME="Sphinx_${VERSION}_x64_portable.exe"
          cp src-tauri/target/release/sphinx.exe "$NAME"
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=${NAME}" \
            --input "$NAME" > /dev/null
