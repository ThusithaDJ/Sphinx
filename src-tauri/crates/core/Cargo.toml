[package]
name = "sphinx-core"
version = "0.1.0"
edition = "2021"
description = "Sphinx ingestion & data layer: hashing, dedupe, SQLite schema, folder watching. No GUI/Tauri deps so it can be built and tested standalone."

[dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled"] }
blake3 = "=1.5.4"
notify = "=6.1.1"
notify-debouncer-mini = "=0.4.1"
walkdir = "=2.5.0"
serde = { version = "=1.0.204", features = ["derive"] }
serde_json = "=1.0.120"
chrono = { version = "=0.4.38", features = ["serde"] }
thiserror = "=1.0.63"
# SPHIN-2: cloud vision providers. Blocking reqwest keeps sphinx-core fully
# synchronous (the async job queue lands in SPHIN-7 and will run these on
# worker threads). native-tls => schannel on Windows, so no ring/aws-lc-rs
# build toolchain (NASM/cmake) is needed.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
base64 = "0.22"
# SPHIN-8: video keyframe/audio extraction needs a scratch directory for
# ffmpeg's output, cleaned up automatically when analysis finishes.
tempfile = "=3.10.1"
# SPHIN-6: SFTP upload. Pure-Rust SSH (no OpenSSL/libssh2/vcpkg toolchain
# needed on Windows -- this project already hit real native-toolchain pain
# this session and a C-dependency SFTP crate would risk more of the same).
russh = "0.45"
russh-sftp = "2"
async-trait = "0.1"
# FTPS (explicit FTP over TLS) delivery -- some stock sites (e.g. Shutterstock)
# only offer this, not SFTP. Sync blocking API. rustls (not native-tls): many
# FTPS servers require the data-channel TLS session to resume the control
# channel's session ("require_ssl_reuse") and drop it otherwise; suppaftp's
# rustls backend shares one Arc<ClientConfig> (with rustls's session cache)
# across both connections, native-tls's does not. Pure Rust, no new toolchain.
suppaftp = { version = "6", features = ["rustls"] }
webpki-roots = "0.26"
# One native backend per OS: without a platform feature keyring silently
# falls back to an in-memory mock store and saved credentials vanish on exit.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
tokio = { version = "1", features = ["rt", "time"] }
