[package]
name = "sphinx-core"
version = "0.1.0"
edition = "2021"
description = "Sphinx ingestion & data layer: hashing, dedupe, SQLite schema, folder watching. No GUI/Tauri deps so it can be built and tested standalone."

[dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled"] }
blake3 = "=1.5.4"
notify = "=6.1.1"
notify-debouncer-mini = "=0.4.1"
walkdir = "=2.5.0"
serde = { version = "=1.0.204", features = ["derive"] }
serde_json = "=1.0.120"
chrono = { version = "=0.4.38", features = ["serde"] }
thiserror = "=1.0.63"
# SPHIN-2: cloud vision providers. Blocking reqwest keeps sphinx-core fully
# synchronous (the async job queue lands in SPHIN-7 and will run these on
# worker threads). native-tls => schannel on Windows, so no ring/aws-lc-rs
# build toolchain (NASM/cmake) is needed.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "=3.10.1"
