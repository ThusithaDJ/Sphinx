ShortDescription: AI-assisted titles, descriptions and keywords for stock photos and videos.
Description: |-
  Sphinx is a desktop app for stock photo and video contributors. It analyzes your media with a
  vision model (OpenAI, Gemini, Anthropic, or a local Ollama model), writes titles, descriptions
  and keywords fitted to each stock site's limits (Adobe Stock, Shutterstock, iStock, Dreamstime,
  123RF, Pond5 and custom sites), embeds IPTC/XMP metadata with ExifTool, exports site CSVs and
  uploads over SFTP/FTPS. Requires ExifTool, plus FFmpeg for video.
